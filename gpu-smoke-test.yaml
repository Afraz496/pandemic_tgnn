# Fast (~1 min) check that the image actually sees the GPU, BEFORE running the
# real pipeline. Overrides the image CMD to run nvidia-smi + a torch CUDA probe,
# then exits. Does NOT touch GCS or train anything.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-smoke-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: gpu-pool
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: gpu-check
        image: us-central1-docker.pkg.dev/gresp7/gresp/gresp:v3   # <-- your new CUDA tag
        imagePullPolicy: Always
        command: ["/bin/bash", "-lc"]
        args:
          - |
            echo "=== nvidia-smi ==="; nvidia-smi || echo "nvidia-smi NOT available";
            echo "=== torch ===";
            python -c "import torch; print('torch       :', torch.__version__); print('cuda build  :', torch.version.cuda); print('is_available:', torch.cuda.is_available()); print('device      :', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU ONLY')"
        resources:
          limits:
            nvidia.com/gpu: 1